name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - name: Poner la versión en el nombre del APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+)\..*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk "paquito-adventure-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: paquito-adventure-${{ env.VERSION }}
          path: paquito-adventure-${{ env.VERSION }}.apk
